name: Showcase verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build JobFinder.slnx -c Release
      - name: Offline rules, LLM doubles and recorded source parsing
        run: >-
          dotnet tests/JobFinder.Tests/bin/Release/net10.0/JobFinder.Tests.dll
          -namespace JobFinder.Tests.Core -namespace JobFinder.Tests.Llm
          -namespace JobFinder.Tests.Sources -maxThreads 4
      - name: Native PostgreSQL transport and recovery
        run: >-
          dotnet tests/JobFinder.Tests/bin/Release/net10.0/JobFinder.Tests.dll
          -class JobFinder.Tests.Pipeline.WolverineIntegrationTests -maxThreads 4
      - name: Scan public Git history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --log-opts=--all --redact
