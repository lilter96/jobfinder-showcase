<!DOCTYPE html><html><body><div id="app"></div><template id="HH-Lux-InitialState">{&quot;vacancyView&quot;: {&quot;vacancyFull&quot;: {&quot;vacancy&quot;: {&quot;vacancyId&quot;: 137436500, &quot;name&quot;: &quot;Technical Product Manager (Anti-Fraud &amp; Compliance Platform)&quot;, &quot;description&quot;: &quot;&lt;p&gt; &lt;/p&gt; &lt;p&gt;&lt;em&gt;Secure Global Money Transfers with Cutting-Edge Technology!&lt;/em&gt;&lt;/p&gt; &lt;p&gt;Join our mission to protect cross-border transactions and help customers send money safely worldwide. As a &lt;strong&gt;Technical Product Manager &lt;/strong&gt;in our Anti-Fraud &amp;amp; Compliance team, you&amp;#39;ll help to architect high-performance systems that detect fraud and enforce regulatory compliance.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;🚀 What You&amp;#39;ll Do:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Translate business objectives and regulatory requirements into scalable technical solutions.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Define and execute product strategy, write technical specifications, manage product roadmaps.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Collaborate closely with legal and compliance teams to ensure secure and compliant product delivery.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Enhance compliance and fraud-detection systems with advanced analytics and machine learning.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Oversee agile development processes - writing user stories, managing sprints, and driving continuous delivery with engineering. Support the design, development, and delivery of complex, backend‑intensive systems.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Integrate machine learning and data-driven vision into the overall team and company strategy, fostering innovation and alignment.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;🛠 Tech Stack:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Tools:&lt;/strong&gt; Jira, Confluence, Amplitude&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Backend:&lt;/strong&gt; Golang, .NET, Python&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Cloud &amp;amp; Infrastructure:&lt;/strong&gt; AWS (EKS, Kafka, SQS), Kubernetes, Prometheus/Grafana&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Data &amp;amp; ML:&lt;/strong&gt; Supervised learning models, ETL pipelines, search technologies&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;🔍 We&amp;#39;re Looking For:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;7+ years of experience in product management or technical product roles.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Strong product discovery and problem framing skills.&lt;/strong&gt;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience building &lt;strong&gt;products in risk&lt;/strong&gt;, fraud detection, compliance, or security domains.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Experience leading cross-functional teams and delivering through the full product lifecycle.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Good knowledge of Agile methodologies (Scrum, Kanban); experience leading cross-functional Agile teams.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Proficient in working with APIs, SQL, data pipelines, and basic technical specs.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Strong communication skills &lt;/strong&gt;(English C1+)&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;🌟 It would be a plus:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Understanding of fraud vectors, mitigation strategies, and compliance requirements (e.g., KYC, AML, OFAC, GDPR).&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Familiarity with regulatory landscapes in fintech, payments, or identity verification.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Familiarity with tools like Jira, Confluence, Looker, Amplitude, or similar.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Familiarity with Go, .NET, or Python&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;🌟 What We Offer:&lt;/strong&gt;&lt;/p&gt; &lt;div&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Modern office with free parking in the very center of Minsk.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Remote/ hybrid work opportunity!&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;An exciting and challenging job with talented people around.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Competitive salary and growth opportunities.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Really good hardware.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;26 vacation days &amp;amp; 5 fully covered sick days without sick leave required per year.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Compensation for professional training, seminars, and conferences.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Sports activities reimbursement.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Medical insurance and sports reimbursement.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Referral program – get rewarded for helping us grow the team with talented people.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Company-supported English classes to enhance your professional growth.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;A few words about us:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;IDT Corporation is a global communications company founded in 1990 and headquartered in Newark, New Jersey. We are industry leaders in prepaid communication and payment services and one of the largest international voice carriers.&lt;/p&gt; &lt;p&gt;We are listed on the NYSE, employ over 1800 people across 20 countries, and have over $1.5 billion in revenues.&lt;/p&gt; &lt;/div&gt;&quot;, &quot;status&quot;: {&quot;archived&quot;: false, &quot;disabled&quot;: false, &quot;hiddenInArchive&quot;: false, &quot;premoderationStatus&quot;: &quot;APPROVED&quot;, &quot;approved&quot;: true, &quot;moderatePriorityScore&quot;: 0}, &quot;company&quot;: {&quot;id&quot;: 3636656, &q
