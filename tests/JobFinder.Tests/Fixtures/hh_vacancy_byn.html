<!DOCTYPE html><html><body><div id="app"></div><template id="HH-Lux-InitialState">{&quot;vacancyView&quot;: {&quot;vacancyFull&quot;: {&quot;vacancy&quot;: {&quot;vacancyId&quot;: 137077074, &quot;name&quot;: &quot;Middle Full-stack разработчик (.NET / React)&quot;, &quot;description&quot;: &quot;&lt;p&gt;Добрый день, наш будущий коллега! На связи компания &lt;strong&gt;Артагед&lt;/strong&gt;. ⭐️&lt;/p&gt; &lt;p&gt;Наша команда работает в сфере e-commerce и специализируется на продаже техники с высоким средним чеком: электротранспорт, ноутбуки, телефоны, бытовая техника, садовая техника и другие товары.&lt;/p&gt; &lt;p&gt;Мы активно развиваем внутренние процессы и создаём собственный продукт для автоматизации логистики. Сейчас многие операции по формированию рейсов, обработке доставок и контролю маршрутов выполняются вручную. Наша цель — создать удобную рабочую систему для логистов, курьеров и руководителей.&lt;/p&gt; &lt;p&gt;В связи с развитием продукта приглашаем в команду &lt;strong&gt;Middle Full-stack разработчика (.NET / React)&lt;/strong&gt;.&lt;/p&gt; &lt;p&gt;Нам важен самостоятельный и внимательный разработчик, который умеет работать с существующей архитектурой, аккуратно реализовывать задачи, задавать правильные вопросы и доводить функционал до рабочего результата. Основные технические решения принимает технический лидер, а ваша зона ответственности — качественная разработка, поддержка и развитие продукта.&lt;/p&gt; &lt;p&gt;Работа ориентировочно на 60% состоит из backend-разработки и на 40% — из frontend-разработки.&lt;/p&gt; &lt;h2&gt;Чем предстоит заниматься&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Дописывать и развивать MVP внутренней логистической системы.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Реализовывать справочники, импорт доставок, функционал сборки рейсов и предварительного просмотра укладки.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Разрабатывать личный кабинет курьера и инструменты для работы логистов.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Создавать и поддерживать API на ASP.NET Core.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Работать с операциями Command / Query, валидацией данных и бизнес-логикой.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Работать с PostgreSQL через EF Core.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Разрабатывать интерфейсы на React: таблицы, формы, списки, рабочие экраны логиста, карты и связанные элементы.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Читать и дорабатывать существующий код в рамках принятой архитектуры и стандартов проекта.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;После запуска продукта участвовать в поддержке системы: исправлять ошибки, разбирать обратную связь пользователей и развивать функционал по приоритетам бизнеса.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Взаимодействовать с техническим лидером, логистами и другими участниками команды для уточнения требований и проверки реализованных решений.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Требования&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Коммерческий опыт разработки от 1–3 лет.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Уверенное знание C# и ASP.NET Core.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Практический опыт разработки REST API.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Понимание принципов построения backend-приложений, разделения на слои, работы с бизнес-логикой и базами данных.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Практический опыт работы с Entity Framework Core и PostgreSQL.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Уверенное владение React и TypeScript.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Умение самостоятельно собрать рабочий экран: таблицу, форму, список, фильтрацию, обработку пользовательских действий.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Понимание работы с состоянием, запросами к API и обработкой ошибок на frontend.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Умение читать чужой код, соблюдать принятые в проекте правила и поддерживать единый стиль разработки.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Внимательность к деталям, ответственность за результат и готовность разбираться в бизнес-процессах компании.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Умение задавать вопросы до начала разработки, если постановка требует уточнений.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Русский язык — документация, интерфейсы и рабочая коммуникация ведутся на русском.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Будет преимуществом&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Опыт работы с Docker.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Опыт интеграции или работы с картографическими сервисами: Яндекс Карты, Google Maps или аналогами.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Опыт работы с системами логистики, доставки, TMS, складскими системами или e-commerce-проектами.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Опыт разработки внутренних корпоративных систем, CRM, ERP или операционных кабинетов.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Знакомство с Quartz, Aspire, OpenAPI-клиентами или похожими инструментами.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Если вы не работали со всем стеком из списка, это не критично. Для нас важнее уверенная база в .NET и React, способность быстро разбираться в новом и желание создавать удобный рабочий инструмент для реального бизнеса.&lt;/p&gt; &lt;h2&gt;Стек проекта&lt;/h2&gt; &lt;p&gt;&lt;strong&gt;Backend:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;.NET 8&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;ASP.NET Core&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Entity Framework Core&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;PostgreSQL&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Frontend:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;React 19&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;TypeScript&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Vite&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;TanStack Query&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;TanStack Router&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Zustand&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Tailwind CSS&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;shadcn/ui&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Дополнительно:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Aspire&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;OpenAPI-клиент&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Quartz&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Условия&lt;/h2&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Работа в штате, полный рабочий день.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Формат работы: офис или гибридный формат.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;График работы: с 8:00–9:00 до 17:00–18:00.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Испытательный срок: 3 месяца.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Заработная плата: &lt;strong&gt;4 000–6 000 BYN до вычета налогов&lt;/strong&gt;.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Официальное трудоустройство по ТК РБ.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Стабильная работа в развивающейся компании в сфере e-commerce.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Возможность участвовать в создании продукта с нуля и видеть прямой результат своей работы в ежедневных процессах компании.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Работа в команде с понятными задачами, адекватным руководством и техническим лидером, который определяет архитектурное направление проекта.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Возможность влиять на развитие внутренней логистической системы после запуска.&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Важно&lt;/h2&gt; &lt;p&gt;Это не проект «для портфолио» и не очередной лендинг. Вы будете создавать систему, которой ежедневно будут пользоваться логисты и курьеры компании: формировать рейсы, обрабатывать доставки, работать с маршрутами и контролировать выполнение заказов.&lt;/p&gt; &lt;p&gt;Нам нужен разработчик, которому интересно не просто писать код по техническому заданию, а понимать, какую реальную рабочую задачу решает каждый экран, API-метод или бизнес-правило.&lt;/p&gt; &lt;p&gt;Если вы внимательно прочли вакансию, уверенно работаете с .NET и React, любите порядок в коде и хотите участвовать в создании полезного продукта для реального бизнеса — напишите в отклике:&lt;/p&gt; &lt;p&gt;&lt;strong&gt;«Разработчик в команду»&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Также кратко расскажите, с какими задачами вы работали в .NET и React и был ли у вас опыт разработки внутренних систем, CRM, логистических или e-commerce-продуктов.&lt;/p&gt; &lt;p&gt;Откликайтесь. Ждём вас в команде Артагед! 🚀&lt;/p&gt; &lt;div&gt; &lt;/div&gt;&quot;, &quot;status&quot;: {&quot;archived&quot;: false, &quot;disabled&quot;: false, &quot;hiddenInArchive&quot;: false, &quot;premoderationStatus&quot;: &quot;APPROVED&quot;, &quot;approved&quot;: true, &quot;moderatePriorityScore&quot;: 2}, &quot;company&quot;: {&quot;id&quot;: 11494292, &quot;name&quot;: &quot;Артагед&quot;, &quot;logos&quot;: [{&quot;type&quot;: &quot;ORIGINAL&quot;, &quot;url&quot;: &quot;/employer-logo-original-round/7000869.png&quot;}, {&quot;type&quot;: &quot;employerPage&quot;, &quot;url&quot;: &quot;/employer-logo-round/7000869.png&quot;}, {&quot;type&quot;: &quot;searchResultsPage&quot;, &quot;url&quot;: &quot;/employer-logo-round/7000870.png&quot;}, {&quot;type&quot;: &quot;small&quot;, &quot;url&quot;: &quot;/employer-logo-round/7000870.png&quot;}], &quot;showSimilarVacancies&quot;: true, &quot;trusted&quot;: true, &quot;category&quot;: &quot;COMPANY&quot;, &quot;countryId&quot;: 4, &quot;employerWithSpecificCountryLaws&quot;: true, &quot;visibleName&quot;: &quot;Артагед&quot;, &quot;employerOrganizationFormId&quot;: 0, &quot;showOrganizationForm&quot;: true, &quot;state&quot;: &quot;APPROVED&quot;, &quot;companySiteUrl&quot;: &quot;&quot;, &quot;accreditedITEmployer&quot;: false, &quot;isIdentifiedByEsia&quot;: false, &quot;employerOnAdditionalCheck&quot;: false}, &quot;area&quot;: {&quot;id&quot;: 1002, &quot;countryIsoCode&quot;: &quot;BY&quot;, &quot;name&quot
