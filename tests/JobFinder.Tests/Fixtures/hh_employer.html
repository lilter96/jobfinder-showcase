<!DOCTYPE html><html><body><div id="app"></div><template id="HH-Lux-InitialState">{&quot;employerInfo&quot;: {&quot;accreditedITEmployer&quot;: false, &quot;itAccreditationBlocked&quot;: false, &quot;id&quot;: 245592, &quot;name&quot;: &quot;ROSSKO&quot;, &quot;category&quot;: &quot;company&quot;, &quot;sizeCategory&quot;: &quot;largest&quot;, &quot;address&quot;: &quot;Новосибирск&quot;, &quot;site&quot;: {&quot;hostname&quot;: &quot;wemake.rossko.ru&quot;, &quot;href&quot;: &quot;https://wemake.rossko.ru/&quot;}, &quot;industries&quot;: [{&quot;id&quot;: 15, &quot;trl&quot;: &quot;Автомобильный бизнес&quot;, &quot;items&quot;: [547, 546]}], &quot;hrBrand&quot;: null, &quot;badges&quot;: {&quot;badge&quot;: [{&quot;type&quot;: &quot;employer-hh-rating&quot;, &quot;description&quot;: &quot;Топ-200 в Рейтинге работодателей России (крупнейшие компании)&quot;, &quot;url&quot;: &quot;https://rating.hh.ru/history/rating2025&quot;, &quot;position&quot;: &quot;144&quot;, &quot;year&quot;: 2025}]}, &quot;description&quot;: &quot;&lt;p&gt;&lt;strong&gt;РОССКО — всегда в движении!&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Вместе к новым целям, возможностям и карьере.&lt;/p&gt; &lt;p&gt;Хочешь делать больше, чем просто работать? Мечтаешь, чтобы твой труд влиял на целую отрасль? Добро пожаловать в РОССКО (ROSSKO) — динамичный хаб инноваций и один из лидеров рынка автозапчастей России и Казахстана. Мы создаём будущее автомобильного рынка. Вместе с тобой!&lt;/p&gt;   &lt;p&gt;&lt;strong&gt;Экосистема, где каждое решение имеет значение&lt;/strong&gt;&lt;br /&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;12 000+ &lt;/strong&gt;профессионалов уже стали частью нашей команды&lt;/p&gt; &lt;p&gt;&lt;strong&gt;300 000+&lt;/strong&gt; артикулов в нашем дистрибьюторском портфеле — это самый широкий выбор для клиентов&lt;/p&gt; &lt;p&gt;&lt;strong&gt;125&lt;/strong&gt; городов присутствия в России и Казахстане — наш горизонт постоянно расширяется&lt;/p&gt; &lt;p&gt;&lt;strong&gt;200+&lt;/strong&gt; розничных магазинов открыто за последние 4 года — мы растём с невероятной скоростью&lt;/p&gt; &lt;p&gt;Качество и доверие клиентов с 1997 года.&lt;/p&gt;   &lt;p&gt;&lt;strong&gt;Сила, которая объединяет&lt;/strong&gt;&lt;br /&gt; &lt;/p&gt; &lt;p&gt;Наша экспертиза подкреплена крепкими альянсами. Мы — члены союза АВТОКОМ – ассоциации поставщиков автомобильных компонентов&lt;em&gt; –&lt;/em&gt; и работаем по прямым контрактам с мировыми брендами премиум-класса: LYNXauto, LIQUI MOLY, KYB, NGN, BARDAHL, Bosch и десятками других.&lt;/p&gt;   &lt;p&gt;&lt;strong&gt;Возможности, которые вдохновляют&lt;/strong&gt;&lt;br /&gt; &lt;/p&gt; &lt;p&gt;Мы верим, что талант может проявиться в разных сферах. Поэтому в РОССКО (ROSSKO) ты найдёшь пространство для роста в любом направлении:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Коммерция и развитие бизнеса&lt;/li&gt; &lt;li&gt;Логистика и складские системы&lt;/li&gt; &lt;li&gt;Ретейл и e-commerce&lt;/li&gt; &lt;li&gt;Управление и аналитика&lt;/li&gt; &lt;li&gt;IT и инновационные проекты&lt;/li&gt; &lt;li&gt;Офисный персонал&lt;br /&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Культура, которая ценит&lt;/strong&gt;&lt;br /&gt; &lt;/p&gt; &lt;p&gt;Наш главный актив — это люди. Мы создаём среду, где обмениваются опытом, поддерживают друг друга и вместе празднуют победы. Прозрачная система карьерного роста, современные склады и офисы, корпоративные программы и забота о благополучии команды — это наша философия.&lt;/p&gt;   &lt;p&gt;&lt;strong&gt;Инновации, которые мы создаём&lt;/strong&gt;&lt;br /&gt; &lt;/p&gt; &lt;p&gt;Мы не следим за трендами — мы задаём их сами. Собственные IT-разработки, уникальные логистические решения и клиентоориентированный подход меняют рынок автозапчастей здесь и сейчас. Стань частью команды, которая не боится вызовов и мыслит масштабно.&lt;/p&gt;   &lt;p&gt;&lt;strong&gt;Наша миссия неизменна:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;«Достижение мирового лидерства в удовлетворении потребностей профессионалов рынка автозапчастей и автовладельцев в производстве, дистрибуции, электронной коммерции и клиентском сервисе».&lt;/p&gt; &lt;p&gt;Готов раскрутить свою карьеру? Выбирай направление, изучай вакансии и присоединяйся к команде. Меняй рынок автозапчастей вместе с РОССКО!&lt;/p&gt;&quot;, &quot;accepted&quot;: true, &quot;isTrusted&quot;: true, &quot;isIdentifiedByEsia&quot;: false, &quot;wantsBeTargetEmployer&quot;: true, &quot;complainAcceptable&quot;: true, &quot;hasDivisions&quot;: false, &quot;organizationFormId&quot;: null, &quot;canEditDescription&quot;: false, &quot;employerCountryCode&quot;: &quot;RU&quot;, &quot;targetResumesCount&quot;: 0, &quot;isZpEmployer&quot;: false}, &quot;employerOrganizationSchema&quot;: {&quot;name&quot;: &quot;ROSSKO&quot;, &quot;logoUrl&quot;: &quot;/employer-logo/7332918.png&quot;, &quot;siteUrl&quot;: &quot;https://wemake.rossko.ru/&quot;, &quot;aggregateRating&quot;: {&quot;ratingValue&quot;: &quot;4.2&quot;, &quot;ratingCount&quot;: 715}}, &quot;activeEmployerVacancyCount&quot;: 286}</template></body></html>
